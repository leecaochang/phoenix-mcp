name: HACS

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so an upstream HACS rule change is caught even with no commits.
    - cron: "23 5 * * *"
  workflow_dispatch:

# Least privilege: both the pinned gate and the scheduled compatibility canary
# only read the checkout and report a result.
permissions:
  contents: read

jobs:
  validate:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: HACS Action
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

  compatibility-canary:
    name: HACS current-rules canary
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: HACS Action current rules
        # This isolated scheduled job intentionally follows upstream so a new
        # HACS submission rule is visible without making a mutable ref a merge gate.
        uses: hacs/action@main
        with:
          category: integration
