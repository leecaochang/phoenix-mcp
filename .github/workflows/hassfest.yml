name: Hassfest

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so a new Home Assistant manifest rule is caught even with no commits.
    - cron: "23 5 * * *"
  workflow_dispatch:

# Least privilege: these two jobs execute a MUTABLE upstream ref on purpose (see
# the comment on the action itself), so the token they run with is the thing to
# bound. They only read the checkout and report a result; nothing here writes to
# the repository, so no other scope is needed.
permissions:
  contents: read

jobs:
  validate:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Hassfest
        # Runs with no exclusions, which is also what hacs/default runs against a
        # submission (its own workflow clones the repo and runs the same image),
        # so this job passing is the thing that predicts that one passing. That is
        # why Phoenix's own operator-facing catalogs live in catalogs/ rather than
        # translations/: hassfest validates translations/en.json against a closed
        # set of Home Assistant categories and errors on anything else.
        #
        # DELIBERATELY a moving ref, unlike the actions/* pins above, for the
        # reason in the paragraph before this one: pinning a SHA would validate
        # against yesterday's manifest rules while the submission runs today's,
        # so the job would go green exactly when it most needs to fail.
        uses: home-assistant/actions/hassfest@master
