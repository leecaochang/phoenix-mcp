name: Hassfest

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so a new Home Assistant manifest rule is caught even with no commits.
    - cron: "23 5 * * *"
  workflow_dispatch:

# Least privilege: both the pinned gate and the scheduled compatibility canary
# only read the checkout and report a result.
permissions:
  contents: read

jobs:
  validate:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Hassfest
        # Runs with no exclusions, which is also what hacs/default runs against a
        # submission (its own workflow clones the repo and runs the same image),
        # so this job passing is the thing that predicts that one passing. That is
        # why Phoenix's own operator-facing catalogs live in catalogs/ rather than
        # translations/: hassfest validates translations/en.json against a closed
        # set of Home Assistant categories and errors on anything else.
        #
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb

  compatibility-canary:
    name: Hassfest current-rules canary
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Hassfest current rules
        # This isolated scheduled job intentionally follows upstream so a new
        # manifest rule is visible without making a mutable ref a merge gate.
        uses: home-assistant/actions/hassfest@master
